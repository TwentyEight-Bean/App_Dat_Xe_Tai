<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="truckBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background App Rounded Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Speed Motion Trails behind Truck -->
  <g opacity="0.85">
    <path d="M 60 210 L 170 210" stroke="#60A5FA" stroke-width="12" stroke-linecap="round" />
    <path d="M 30 250 L 150 250" stroke="#93C5FD" stroke-width="14" stroke-linecap="round" />
    <path d="M 70 290 L 160 290" stroke="#BFDBFE" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Fast Truck Icon with Shadow -->
  <g filter="url(#dropShadow)" transform="translate(10, 10)">
    <!-- Cargo Box (Thùng xe tải) -->
    <rect x="130" y="160" width="180" height="150" rx="16" fill="url(#truckBodyGrad)" stroke="#E2E8F0" stroke-width="3" />
    
    <!-- Stripe on Cargo Box (Tốc độ / Siêu tốc) -->
    <path d="M 130 230 L 310 230" stroke="url(#speedGrad)" stroke-width="18" stroke-linecap="square" />
    <path d="M 130 256 L 310 256" stroke="#2563EB" stroke-width="6" />

    <!-- Truck Cabin (Đầu cabin xe tải) -->
    <path d="M 315 200 L 375 200 Q 425 210 440 260 L 440 310 L 315 310 Z" fill="url(#truckBodyGrad)" stroke="#E2E8F0" stroke-width="3" />

    <!-- Windshield (Kính cabin xe tải) -->
    <path d="M 330 215 L 375 215 Q 405 220 415 255 L 330 255 Z" fill="#38BDF8" />

    <!-- Cabin Headlight -->
    <path d="M 436 280 L 442 280 L 442 296 L 436 296 Z" fill="#FBBF24" />

    <!-- Chassis Base -->
    <rect x="120" y="305" width="325" height="16" rx="6" fill="#334155" />

    <!-- Back Wheels (Bánh sau) -->
    <g transform="translate(185, 325)">
      <circle cx="0" cy="0" r="38" fill="#1E293B" />
      <circle cx="0" cy="0" r="22" fill="#94A3B8" />
      <circle cx="0" cy="0" r="10" fill="#0F172A" />
    </g>

    <!-- Front Wheel (Bánh trước) -->
    <g transform="translate(385, 325)">
      <circle cx="0" cy="0" r="38" fill="#1E293B" />
      <circle cx="0" cy="0" r="22" fill="#94A3B8" />
      <circle cx="0" cy="0" r="10" fill="#0F172A" />
    </g>
  </g>

  <!-- Speed Lightning Bolt Badge -->
  <g transform="translate(200, 175) scale(0.9)">
    <polygon points="12,0 0,16 9,16 6,30 22,12 13,12" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
  </g>
</svg>
