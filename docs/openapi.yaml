openapi: 3.0.3
info:
  title: App Đặt Xe Tải API (Truck Booking API)
  description: Tài liệu OpenAPI đặc tả các endpoints cho Frontend (Khách hàng & Tài xế) và Admin.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ------------------
    # COMMON SCHEMAS
    # ------------------
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Lỗi hệ thống hoặc request không hợp lệ."
        code:
          type: string
          example: "ERROR_CODE"

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Thành công"

    # ------------------
    # AUTH SCHEMAS
    # ------------------
    LoginRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          example: "0901234567"
    
    VerifyOtpRequest:
      type: object
      required:
        - phone
        - otp
      properties:
        phone:
          type: string
          example: "0901234567"
        otp:
          type: string
          example: "123456"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [CUSTOMER, DRIVER, ADMIN]

    # ------------------
    # ADDRESS SCHEMAS
    # ------------------
    CreateAddressRequest:
      type: object
      required:
        - addressText
      properties:
        title:
          type: string
          example: "Kho hàng Tân Bình"
        addressText:
          type: string
          example: "123 Cộng Hòa, Phường 12, Quận Tân Bình, TP.HCM"
        latitude:
          type: number
          example: 10.8014
        longitude:
          type: number
          example: 106.6521
        contactName:
          type: string
          example: "Anh Tuấn"
        contactPhone:
          type: string
          example: "0987654321"
        isDefault:
          type: boolean
          example: false

    AddressItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        addressText:
          type: string
        latitude:
          type: string
        longitude:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ------------------
    # DRIVER KYC SCHEMAS
    # ------------------
    DriverDocumentItem:
      type: object
      required:
        - docType
        - fileUrl
      properties:
        docType:
          type: string
          enum: [CCCD_FRONT, CCCD_BACK, DRIVER_LICENSE, VEHICLE_REGISTRATION, PORTRAIT]
          example: "CCCD_FRONT"
        fileUrl:
          type: string
          example: "https://res.cloudinary.com/demo/image/upload/cccd_front.jpg"
        docNumber:
          type: string
          example: "079201001234"

    SubmitDriverKycRequest:
      type: object
      required:
        - documents
      properties:
        vehicleTypeId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        licensePlate:
          type: string
          example: "51C-888.99"
        driverLicenseNo:
          type: string
          example: "GPLX-790123456"
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DriverDocumentItem'

    UpdateDriverOnlineRequest:
      type: object
      required:
        - isOnline
      properties:
        isOnline:
          type: boolean
          example: true

    RejectKycRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          example: "Ảnh chụp bằng lái xe bị mờ góc, vui lòng chụp lại rõ nét."

    # ------------------
    # BOOKING SCHEMAS
    # ------------------
    EstimatePriceRequest:
      type: object
      required:
        - vehicleTypeId
        - originLat
        - originLng
        - destLat
        - destLng
      properties:
        vehicleTypeId:
          type: string
          format: uuid
        originLat:
          type: number
        originLng:
          type: number
        destLat:
          type: number
        destLng:
          type: number
        services:
          type: array
          items:
            type: string
          description: "Mảng ID các dịch vụ kèm theo (VD: Bốc xếp)"

    EstimatePriceResponse:
      type: object
      properties:
        distanceKm:
          type: number
          example: 12.5
        basePrice:
          type: number
          example: 250000
        surchargePrice:
          type: number
          example: 50000
        totalPrice:
          type: number
          example: 300000

    CreateBookingRequest:
      type: object
      required:
        - vehicleTypeId
        - originAddress
        - originLat
        - originLng
        - destinationAddress
        - destLat
        - destLng
        - estimatedPrice
      properties:
        vehicleTypeId:
          type: string
          format: uuid
        originAddress:
          type: string
        originLat:
          type: number
        originLng:
          type: number
        destinationAddress:
          type: string
        destLat:
          type: number
        destLng:
          type: number
        estimatedPrice:
          type: number
        paymentMethod:
          type: string
          enum: [CASH, WALLET, VNPAY, MOMO]
          default: CASH

    # ------------------
    # ------------------
    # LOCATION SCHEMAS
    # ------------------
    UpdateLocationRequest:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
        lng:
          type: number
        heading:
          type: number

    # ------------------
    # ADMIN PRICING & SURCHARGES SCHEMAS
    # ------------------
    PricingRuleItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vehicleTypeId:
          type: string
          format: uuid
        basePrice:
          type: number
          example: 150000
        baseDistanceKm:
          type: number
          example: 4
        pricePerKm:
          type: number
          example: 18000
        pricePerKmNext:
          type: number
          example: 14000
        rushHourMultiplier:
          type: number
          example: 1.2
        nightMultiplier:
          type: number
          example: 1.3

    UpdatePricingRuleRequest:
      type: object
      properties:
        basePrice:
          type: number
          example: 160000
        baseDistanceKm:
          type: number
          example: 4
        pricePerKm:
          type: number
          example: 19000
        pricePerKmNext:
          type: number
          example: 15000
        rushHourMultiplier:
          type: number
          example: 1.25
        nightMultiplier:
          type: number
          example: 1.35

    SurchargeServiceItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: "BOC_XEP_TANG_TRET"
        name:
          type: string
          example: "Bốc xếp tầng trệt (dưới 50m)"
        description:
          type: string
          example: "Bốc xếp hàng hóa lên xuống xe tại tầng trệt"
        price:
          type: number
          example: 50000
        unit:
          type: string
          example: "chuyến"
        isOptional:
          type: boolean
          example: true
        isAuto:
          type: boolean
          example: false
        isActive:
          type: boolean
          example: true

    CreateSurchargeServiceRequest:
      type: object
      required:
        - code
        - name
        - price
      properties:
        code:
          type: string
          example: "DONG_GOI_HANG"
        name:
          type: string
          example: "Dịch vụ đóng gói bọc màng PE"
        description:
          type: string
          example: "Bọc màng co bảo vệ đồ đạc"
        price:
          type: number
          example: 70000
        unit:
          type: string
          example: "kiện"
        isOptional:
          type: boolean
          default: true
        isAuto:
          type: boolean
          default: false

    UpdateSurchargeServiceRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        unit:
          type: string
        isOptional:
          type: boolean
        isAuto:
          type: boolean
        isActive:
          type: boolean

    # ------------------
    # ADMIN DRIVER MANAGEMENT SCHEMAS
    # ------------------
    DriverStatusUpdateRequest:
      type: object
      required:
        - isActive
      properties:
        isActive:
          type: boolean
          example: true
          description: "true = Hoạt động bình thường; false = Khóa tài xế"

    # ------------------
    # B2B CUSTOMER SCHEMAS
    # ------------------
    B2bCustomerItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
          example: "Công ty Cổ phần Vận tải & Logistics ABC"
        taxCode:
          type: string
          example: "0312345678"
        contactPerson:
          type: string
          example: "Nguyễn Văn Giám Đốc"
        contactPhone:
          type: string
          example: "0909888999"
        contactEmail:
          type: string
          example: "contact@abclogistics.vn"
        address:
          type: string
          example: "123 Đường Tân Tạo, Bình Tân, TP.HCM"
        creditLimit:
          type: number
          example: 50000000
        currentDebt:
          type: number
          example: 12500000
        availableCredit:
          type: number
          example: 37500000
        discountPercent:
          type: number
          example: 10
        paymentTermDays:
          type: integer
          example: 30
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, TERMINATED]
          example: "ACTIVE"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateB2bCustomerRequest:
      type: object
      required:
        - companyName
        - taxCode
        - contactPerson
        - contactPhone
      properties:
        companyName:
          type: string
          example: "Công ty TNHH Thương mại Dịch vụ Ánh Dương"
        taxCode:
          type: string
          example: "0399887766"
        contactPerson:
          type: string
          example: "Trần Thị Trưởng Phòng"
        contactPhone:
          type: string
          example: "0918776655"
        contactEmail:
          type: string
          example: "ketoan@anhduong.vn"
        address:
          type: string
          example: "456 Xa Lộ Hà Nội, TP. Thủ Đức, TP.HCM"
        creditLimit:
          type: number
          default: 0
          example: 30000000
        discountPercent:
          type: number
          default: 0
          example: 5
        paymentTermDays:
          type: integer
          default: 30
          example: 30

    UpdateB2bCustomerRequest:
      type: object
      properties:
        companyName:
          type: string
        contactPerson:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        address:
          type: string
        creditLimit:
          type: number
        discountPercent:
          type: number
        paymentTermDays:
          type: integer

    UpdateB2bCustomerStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, TERMINATED]
          example: "ACTIVE"

    RecordB2bPaymentRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          example: 10000000
          description: "Số tiền doanh nghiệp thanh toán trả nợ công nợ (VNĐ)"
        note:
          type: string
          example: "Thanh toán ủy nhiệm chi đợt 1 tháng 10 qua VCB"

security:
  - bearerAuth: []

paths:
  # ==========================================
  # AUTHENTICATION MODULE
  # ==========================================
  /auth/request-otp:
    post:
      tags:
        - Auth
      summary: Yêu cầu gửi mã OTP đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đã gửi OTP thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/verify-otp:
    post:
      tags:
        - Auth
      summary: Xác thực mã OTP và nhận Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Đăng nhập thành công, trả về JWT Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  # ==========================================
  # SỔ ĐỊA CHỈ KHÁCH HÀNG (ADDRESS BOOK)
  # ==========================================
  /customer/addresses:
    get:
      tags:
        - Customer Address Book
      summary: Lấy danh sách sổ địa chỉ đã lưu của khách hàng
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách địa chỉ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddressItem'

    post:
      tags:
        - Customer Address Book
      summary: Thêm địa chỉ mới vào sổ địa chỉ
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Thêm địa chỉ thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AddressItem'

  /customer/addresses/{id}:
    put:
      tags:
        - Customer Address Book
      summary: Cập nhật thông tin địa chỉ
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AddressItem'

    delete:
      tags:
        - Customer Address Book
      summary: Xóa địa chỉ khỏi sổ
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /customer/addresses/{id}/default:
    patch:
      tags:
        - Customer Address Book
      summary: Đặt địa chỉ làm mặc định
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Đặt mặc định thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AddressItem'

  # ==========================================
  # BOOKING MODULE (KHÁCH HÀNG)
  # ==========================================
  /bookings/estimate:
    post:
      tags:
        - Booking (Customer)
      summary: Tính giá cước dự kiến (Trước khi đặt xe)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimatePriceRequest'
      responses:
        '200':
          description: Trả về giá tiền dự tính
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimatePriceResponse'

  /bookings:
    post:
      tags:
        - Booking (Customer)
      summary: Tạo đơn đặt xe mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Đặt xe thành công, đang tìm tài xế (SEARCHING)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  bookingId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: "SEARCHING"

    get:
      tags:
        - Booking (Customer)
      summary: Lấy danh sách lịch sử chuyến đi của tôi
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  # Rút gọn schema trả về...

  # ==========================================
  # DRIVER KYC & STATUS MODULE
  # ==========================================
  /driver/vehicle-types:
    get:
      tags:
        - Driver KYC
      summary: Lấy danh sách các loại xe tải đang hoạt động
      responses:
        '200':
          description: Danh sách loại xe
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object

  /driver/profile:
    get:
      security:
        - bearerAuth: []
      tags:
        - Driver KYC
      summary: Lấy thông tin hồ sơ và giấy tờ tài xế
      responses:
        '200':
          description: Thông tin hồ sơ tài xế
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn

  /driver/kyc/status:
    get:
      security:
        - bearerAuth: []
      tags:
        - Driver KYC
      summary: Lấy trạng thái phê duyệt KYC và điều kiện bật Trực tuyến
      responses:
        '200':
          description: Chi tiết trạng thái KYC

  /driver/kyc/submit:
    post:
      security:
        - bearerAuth: []
      tags:
        - Driver KYC
      summary: Nộp hồ sơ KYC (CCCD, Bằng lái, Cà vẹt xe, Biển số)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitDriverKycRequest'
      responses:
        '200':
          description: Nộp hồ sơ thành công, trạng thái chuyển sang PENDING
        '400':
          description: Thiếu giấy tờ hoặc định dạng không hợp lệ

  /driver/status/online:
    patch:
      security:
        - bearerAuth: []
      tags:
        - Driver Operations
      summary: Bật/Tắt trạng thái Trực tuyến (Online / Offline Toggle)
      description: |
        Chỉ tài xế đã được Quản trị viên duyệt KYC (kycStatus = 'APPROVED')
        và tài khoản đang hoạt động (isActive = true) mới được phép bật isOnline = true.
        Nếu chưa duyệt, server chặn ngay lập tức với mã lỗi HTTP 403 Forbidden (KYC_NOT_APPROVED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverOnlineRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
        '403':
          description: Bị chặn do chưa duyệt KYC (KYC_NOT_APPROVED) hoặc tài khoản bị khóa

  # ==========================================
  # ADMIN MANAGEMENT MODULE (KYC, DRIVERS, PRICING, B2B)
  # ==========================================
  /admin/drivers:
    get:
      security:
        - bearerAuth: []
      tags:
        - Admin Management
      summary: Danh sách toàn bộ tài xế (Lọc trạng thái KYC, online, tìm kiếm)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: kycStatus
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        - name: isOnline
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          description: "Tìm kiếm theo họ tên, số điện thoại hoặc biển số xe"
          schema:
            type: string
      responses:
        '200':
          description: Danh sách tài xế theo điều kiện lọc

  /admin/drivers/kyc-pending:
    get:
      security:
        - bearerAuth: []
      tags:
        - Admin KYC
      summary: Danh sách hồ sơ tài xế đang chờ duyệt KYC
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách tài xế chờ duyệt

  /admin/drivers/{driverId}:
    get:
      security:
        - bearerAuth: []
      tags:
        - Admin KYC
      summary: Xem chi tiết hồ sơ tài xế và các giấy tờ đã nộp
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết hồ sơ tài xế

  /admin/drivers/{driverId}/status:
    patch:
      security:
        - bearerAuth: []
      tags:
        - Admin Management
      summary: Khóa hoặc mở khóa hoạt động của tài xế
      description: "Khi isActive = false, hệ thống tự động cưỡng chế chuyển isOnline = false"
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusUpdateRequest'
      responses:
        '200':
          description: Cập nhật trạng thái hoạt động thành công

  /admin/drivers/{driverId}/kyc/approve:
    post:
      security:
